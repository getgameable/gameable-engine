<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <title>Made with Gameable</title>
    <link id="favicon" rel="icon" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="backdrop" class="backdrop" aria-hidden="true"></div>
    <canvas id="canvas" aria-label="The character and where they live"></canvas>

    <header class="who gm-card glass">
      <strong id="name">Your character</strong>
      <span id="hint">Getting ready…</span>
      <div
        id="loading"
        class="loading"
        role="progressbar"
        aria-label="Loading"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <i id="loading-bar"></i>
      </div>
      <p id="status" class="gm-error" role="alert" hidden></p>
    </header>

    <div id="stick" class="stick" aria-hidden="true" hidden><i></i></div>

    <section id="conversation" class="conversation" aria-label="Talk">
      <div
        id="history"
        class="history"
        role="log"
        aria-label="Conversation"
        aria-live="polite"
      ></div>
      <div class="gm-card glass chat">
        <div class="chat-heading">
          <span id="talk-status" role="status">Say hello</span>
          <button id="wave" class="gm-pill" disabled>Wave</button>
        </div>
        <p id="talk-error" class="gm-error" role="alert" hidden></p>
        <form id="question" class="question">
          <label class="sr-only" for="question-text">Message</label>
          <input
            id="question-text"
            class="gm-input"
            autocomplete="off"
            maxlength="4096"
            placeholder="Start talking, then say hello…"
            disabled
          />
          <button id="send" class="gm-pill" type="submit" disabled>Send</button>
        </form>
        <div id="mic-wave" class="mic-wave" role="status" aria-label="Microphone input" hidden>
          <canvas id="waveform" width="600" height="36" aria-hidden="true"></canvas
          ><span id="mic-status">Listening</span>
        </div>
        <div class="actions">
          <button id="connect" class="gm-pill primary" disabled>Start talking</button>
          <button id="microphone" class="gm-pill" aria-pressed="false" disabled>
            Microphone off
          </button>
          <button id="interrupt" class="gm-pill" hidden>Interrupt</button>
        </div>
      </div>
    </section>

    <a
      id="brand"
      class="brand gm-chip glass"
      href="https://engine.gameable.com/"
      target="_blank"
      rel="noreferrer"
    >
      <img id="logo" width="18" height="18" alt="" />
      <span id="brand-text">Made with Gameable</span>
    </a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
