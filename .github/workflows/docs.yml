name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: vitepress build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `docs/api/` is generated and gitignored, and the site's sidebar and its
      # dead-link check both depend on it. It has to exist before VitePress runs.
      - name: Generate the API reference
        run: npm run docs:api

      - name: Build the documentation site
        run: npm run docs:build

      # Artifact only. Publishing is a separate decision and is not wired up.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist
          retention-days: 14
