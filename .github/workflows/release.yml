name: release

# Publishes `gameable` and `create-gameable` to npm when main carries a version
# that is not on npm yet. Releasing is bumping the version
# (`npm run release:version -- <x.y.z>`) and letting it reach main.
#
# The token only stages (`npm stage publish`, npm 12): a staged version is not
# installable until an owner approves it on npmjs.com (or `npm stage approve
# <id>`) with their second factor. Re-running this before the approval stages
# the same version again; reject the stale one.
#
# It runs after `ci` passes on main, for the commit ci tested, and does not
# run the suite again: the allocation tests read the heap, and a second run on
# another runner can fail one by noise alone and block a release ci passed.
#
# Runs only in the public repository: the internal tree carries this file too.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # the release and its tag
  id-token: write # npm provenance

jobs:
  publish:
    if: >-
      github.repository == 'getgameable/gameable-engine' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: npm 12, for npm stage
        run: npm install --global npm@12

      - name: Is this version on npm?
        id: version
        run: |
          version=$(node -p "require('./packages/gameable/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = 0.0.0 ] || { npm view "gameable@$version" version && npm view "create-gameable@$version" version; } >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Stage gameable on npm, to be approved on npmjs.com
        if: steps.version.outputs.publish == 'true'
        run: |
          # Each package on its own: a re-run stages only what is neither on npm
          # nor already waiting for approval.
          v="${{ steps.version.outputs.version }}"
          if npm view "gameable@$v" version >/dev/null 2>&1; then echo "gameable@$v is on npm"; exit 0; fi
          if npm stage list gameable 2>/dev/null | grep -qx "version: $v"; then echo "gameable@$v is already staged"; exit 0; fi
          npm stage publish -w packages/gameable --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage create-gameable on npm, to be approved on npmjs.com
        if: steps.version.outputs.publish == 'true'
        run: |
          # Each package on its own: a re-run stages only what is neither on npm
          # nor already waiting for approval.
          v="${{ steps.version.outputs.version }}"
          if npm view "create-gameable@$v" version >/dev/null 2>&1; then echo "create-gameable@$v is on npm"; exit 0; fi
          if npm stage list create-gameable 2>/dev/null | grep -qx "version: $v"; then echo "create-gameable@$v is already staged"; exit 0; fi
          npm stage publish -w packages/create-gameable --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and release
        if: steps.version.outputs.publish == 'true'
        run: gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1 || gh release create "v${{ steps.version.outputs.version }}" --target "${{ github.event.workflow_run.head_sha || github.sha }}" --generate-notes --notes "Staged on npm, installable once an owner approves it."
        env:
          GH_TOKEN: ${{ github.token }}
